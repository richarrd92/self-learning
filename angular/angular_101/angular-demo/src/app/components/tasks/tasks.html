<div class="tasks">
  <h3>Tasks</h3>
  <ul>
    @for (task of getTasks(); track task.id) {
      <li class="task-item">
        <app-task
          [id]="task.id"
          [title]="task.title"
          [complete]="task.complete"
          (toggleCompleteEvent)="onToggleComplete($event)"
          (deleteTaskEvent)="deleteTask($event)"
        ></app-task>
      </li>
    }
  </ul>
</div>
