<!-- this is the component specific content that will be rendered in the ng-content in the wrapper class -->
<div id="traffic">
  <p>Last 7 days</p>

  <div id="chart">
    @for (dataPoint of dummyTrafficData; track dataPoint.id) {
      <div [style.height]="(dataPoint.value / maxTraffic) * 100 + '%'"></div>
    }
  </div>
</div>
