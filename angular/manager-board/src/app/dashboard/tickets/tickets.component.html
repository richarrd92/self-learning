<!-- this is the component specific content that will be rendered in the ng-content in the wrapper class -->

<!-- new tickets will be displayed here -->
<div id="content">
  <div id="tickets">
    <ul>
      @for (ticket of tickets; track ticket.id) {
        <app-ticket [data]="ticket" (closeTicket)="onCompleteTicket(ticket.id)"/>
      } @empty {
        <p>No tickets available.</p>
      }
    </ul>
  </div>

  <div id="new-ticket">
    <app-new-ticket (addTicket)="onNewTicket($event)" />
  </div>
</div>
